name: Submit to Developer Showcase
description: Share your live GitHub Pages portfolio in the public workshop showcase.
title: "[Showcase] My portfolio"
labels: [showcase-submission]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Valid open submissions appear in the showcase automatically after deployment. Submit only your own portfolio.
  - type: input
    id: github-username
    attributes:
      label: GitHub username
      description: Must match the account you use to submit this issue.
      placeholder: octocat
    validations:
      required: true
  - type: input
    id: live-pages-url
    attributes:
      label: Live GitHub Pages URL
      description: Use your username.github.io address, including the project path if needed.
      placeholder: https://octocat.github.io/msc-developer-workspace/
    validations:
      required: true
  - type: checkboxes
    id: public-showcase-consent
    attributes:
      label: Public showcase consent
      options:
        - label: I agree to have my GitHub username and portfolio link shown publicly in the MSC Developer Showcase.
          required: true
